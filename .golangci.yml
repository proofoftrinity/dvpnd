# golangci-lint v2. CI runs it as an advisory job: findings are reported, they
# do not fail the run.
version: "2"

run:
  timeout: 10m
  tests: false

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # Security checks: command injection, file permissions, weak crypto,
    # unchecked integer conversions and the like.
    - gosec
  exclusions:
    presets:
      - std-error-handling
